name: Autosana

# Manual run before a release: build the app on EAS with the
# `autosana-simulator` profile, upload it to Autosana and run the tests
# that carry the chosen labels. Needs the EXPO_TOKEN and AUTOSANA_KEY secrets.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build and test
        type: choice
        options: [both, ios, android]
        default: both
      labels:
        description: Autosana labels to run after the upload (comma-separated)
        type: string
        default: regression

permissions:
  contents: read

concurrency:
  group: autosana
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms == 'both' && '["ios","android"]' || format('["{0}"]', inputs.platforms)) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.0
          cache: true
          cache-dependency-path: bun.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up EAS
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on EAS
        working-directory: apps/mobile
        run: |
          eas build --platform "${{ matrix.platform }}" --profile autosana-simulator \
            --non-interactive --wait --json > "$RUNNER_TEMP/build.json"

      - name: Download the build
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          url=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl' "$RUNNER_TEMP/build.json")
          mkdir -p "$RUNNER_TEMP/build"
          cd "$RUNNER_TEMP/build"
          if [[ "${{ matrix.platform }}" == "ios" ]]; then
            # EAS ships simulator builds as .tar.gz; Autosana wants a zipped .app.
            curl -fsSL "$url" -o build.tar.gz
            tar -xzf build.tar.gz
            app=$(find . -maxdepth 2 -name '*.app' -type d | head -1)
            zip -qry Calcom.app.zip "$app"
            echo "path=$RUNNER_TEMP/build/Calcom.app.zip" >> "$GITHUB_OUTPUT"
          else
            curl -fsSL "$url" -o calcom-companion.apk
            echo "path=$RUNNER_TEMP/build/calcom-companion.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the build for the test job
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test ${{ matrix.platform }}
    needs: build
    # Test a platform whose build passed even if the other platform's failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The regression suites take about 2 hours 15 minutes per platform on
    # Autosana's single cloud device, and the action has no wait limit of its own.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Both platforms' suites use the same test account and the same
      # autosana- data, so one platform's tests must finish before the other's
      # start. The builds above still run in parallel.
      max-parallel: 1
      matrix:
        platform: ${{ fromJSON(inputs.platforms == 'both' && '["ios","android"]' || format('["{0}"]', inputs.platforms)) }}
    env:
      BUNDLE_ID: ${{ matrix.platform == 'ios' && 'com.cal.companion' || 'com.calcom.companion' }}
      BUILD_FILE: ${{ matrix.platform == 'ios' && 'Calcom.app.zip' || 'calcom-companion.apk' }}
    steps:
      # The Autosana action reads the commit from the checkout.
      - uses: actions/checkout@v4

      - name: Get the build
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: ${{ runner.temp }}/build

      - name: Upload to Autosana and run tests
        uses: autosana/autosana-ci@9e5b6b075c61b438bac7494da4bedd4ded2237f3 # main, 2026-11-18
        with:
          api-key: ${{ secrets.AUTOSANA_KEY }}
          name: Cal.com
          bundle-id: ${{ env.BUNDLE_ID }}
          platform: ${{ matrix.platform }}
          build-path: ${{ runner.temp }}/build/${{ env.BUILD_FILE }}
          labels: ${{ inputs.labels }}
