name: Autosana

# Manual run before a release: build the app on EAS with the
# `autosana-simulator` profile, upload it to Autosana and run the tests
# that carry the chosen labels. With `publish` ticked and every test job
# passed, it then builds the same commit with the `production` profile and
# uploads it to TestFlight (iOS) and Internal testing (Android). Publishing
# only runs from main with the regression label. Needs the EXPO_TOKEN and
# AUTOSANA_KEY secrets.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build and test
        type: choice
        options: [both, ios, android]
        default: both
      labels:
        description: Autosana labels to run after the upload (comma-separated)
        type: string
        default: regression
      publish:
        description: After every test passes, build with the production profile and upload to TestFlight / Internal testing. Only from main, and labels must include regression
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: autosana
  cancel-in-progress: false

jobs:
  # Runs first, in seconds. With publish ticked, it stops the run before any
  # build or test if the run could never publish.
  preflight:
    name: Check publish settings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.publish }}

      - name: Check the publish settings
        if: ${{ inputs.publish }}
        shell: bash
        env:
          REF: ${{ github.ref }}
          LABELS: ${{ inputs.labels }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          failed=0

          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Publish only runs from main, and this run was started on $REF. Start it again with \"Use workflow from\" set to main, or untick publish to only test this ref."
            failed=1
          fi

          has_regression=0
          IFS=',' read -ra labels <<< "$LABELS"
          for label in "${labels[@]}"; do
            label="${label#"${label%%[![:space:]]*}"}"
            label="${label%"${label##*[![:space:]]}"}"
            [[ "$label" == "regression" ]] && has_regression=1
          done
          if [[ "$has_regression" -ne 1 ]]; then
            echo "::error::Publish needs the full regression tests, but the labels are \"$LABELS\". Add regression to the labels, or untick publish."
            failed=1
          fi

          if [[ "$PLATFORMS" != "android" ]]; then
            version=$(jq -r .expo.version apps/mobile/app.json)
            # Public App Store lookup. If it can't be reached, carry on: the
            # upload fails later with the same advice.
            live=$(curl -fsS --max-time 20 'https://itunes.apple.com/lookup?bundleId=com.cal.companion' \
              | jq -r '.results[0].version // empty') || live=""
            echo "app.json version: $version, live on the App Store: ${live:-unknown}"
            if [[ -n "$live" && "$(printf '%s\n%s\n' "$version" "$live" | sort -V | tail -1)" == "$live" ]]; then
              echo "::error::Version $version is not higher than the version live on the App Store ($live). Bump expo.version in apps/mobile/app.json in a PR, merge it and run the workflow again."
              failed=1
            fi
          fi

          exit "$failed"

  build:
    name: Build ${{ matrix.platform }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms == 'both' && '["ios","android"]' || format('["{0}"]', inputs.platforms)) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.0
          cache: true
          cache-dependency-path: bun.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up EAS
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on EAS
        working-directory: apps/mobile
        run: |
          eas build --platform "${{ matrix.platform }}" --profile autosana-simulator \
            --non-interactive --wait --json > "$RUNNER_TEMP/build.json"

      - name: Download the build
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          url=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl' "$RUNNER_TEMP/build.json")
          mkdir -p "$RUNNER_TEMP/build"
          cd "$RUNNER_TEMP/build"
          if [[ "${{ matrix.platform }}" == "ios" ]]; then
            # EAS ships simulator builds as .tar.gz; Autosana wants a zipped .app.
            curl -fsSL "$url" -o build.tar.gz
            tar -xzf build.tar.gz
            app=$(find . -maxdepth 2 -name '*.app' -type d | head -1)
            zip -qry Calcom.app.zip "$app"
            echo "path=$RUNNER_TEMP/build/Calcom.app.zip" >> "$GITHUB_OUTPUT"
          else
            curl -fsSL "$url" -o calcom-companion.apk
            echo "path=$RUNNER_TEMP/build/calcom-companion.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the build for the test job
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test ${{ matrix.platform }}
    needs: [preflight, build]
    # Test a platform whose build passed even if the other platform's failed,
    # but not when the preflight check stopped the run.
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Both platforms' suites use the same test account and the same
      # autosana- data, so one platform's tests must finish before the other's
      # start. The builds above still run in parallel.
      max-parallel: 1
      matrix:
        platform: ${{ fromJSON(inputs.platforms == 'both' && '["ios","android"]' || format('["{0}"]', inputs.platforms)) }}
    env:
      BUNDLE_ID: ${{ matrix.platform == 'ios' && 'com.cal.companion' || 'com.calcom.companion' }}
      BUILD_FILE: ${{ matrix.platform == 'ios' && 'Calcom.app.zip' || 'calcom-companion.apk' }}
    steps:
      # The Autosana action reads the commit from the checkout.
      - uses: actions/checkout@v4

      - name: Get the build
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: ${{ runner.temp }}/build

      - name: Upload to Autosana and run tests
        uses: autosana/autosana-ci@9e5b6b075c61b438bac7494da4bedd4ded2237f3 # main, 2026-11-18
        with:
          api-key: ${{ secrets.AUTOSANA_KEY }}
          name: Cal.com
          bundle-id: ${{ env.BUNDLE_ID }}
          platform: ${{ matrix.platform }}
          build-path: ${{ runner.temp }}/build/${{ env.BUILD_FILE }}
          labels: ${{ inputs.labels }}

  publish:
    name: Publish ${{ matrix.platform }}
    needs: test
    # needs.test.result is 'success' only when every test job in the matrix
    # passed. A failed, cancelled or skipped test job leaves nothing published.
    # The preflight job already refused other refs; the ref check here is a
    # second guard.
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The same platforms as the test jobs, so only tested platforms ship.
      matrix:
        platform: ${{ fromJSON(inputs.platforms == 'both' && '["ios","android"]' || format('["{0}"]', inputs.platforms)) }}
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.0
          cache: true
          cache-dependency-path: bun.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up EAS
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Uses the credentials stored on EAS and the `production` submit
      # profile in eas.json. --wait also waits for the upload to finish.
      - name: Build and upload on EAS
        working-directory: apps/mobile
        run: |
          eas build --platform "$PLATFORM" --profile production --auto-submit \
            --non-interactive --wait --json > "$RUNNER_TEMP/publish.json"

      - name: Write the job summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .expo.version apps/mobile/app.json)
          json="$RUNNER_TEMP/publish.json"
          if [[ "$PLATFORM" == "ios" ]]; then
            store="TestFlight"
            hint="If version $version is already released or approved on the App Store, Apple refuses new builds for it: bump expo.version in apps/mobile/app.json in a PR, merge it and run the workflow again."
          else
            store="Internal testing"
            hint="Google Play doesn't check the version name, only the version code, which EAS raises on every build. See releasing-android.md, Troubleshooting."
          fi

          {
            echo "## Publish $PLATFORM"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -s "$json" ]] || ! jq -e 'length > 0' "$json" > /dev/null 2>&1; then
            echo "No EAS build was started. See the log of the step that failed." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No EAS build was started. See the log of the step that failed."
            exit 0
          fi

          jq -r --arg store "$store" 'def cell: tostring | gsub("[\\r\\n]+"; " ") | gsub("[|]"; "\\|");
            .[0] as $b
            | "https://expo.dev/accounts/\($b.app.ownerAccount.name)/projects/\($b.app.slug)" as $p
            | "| | |",
              "|---|---|",
              "| Build | [\($b.id)](\($p)/builds/\($b.id)): \($b.status) |",
              "| Version | \($b.appVersion) (\($b.appBuildVersion)) |",
              "| Commit | \($b.gitCommitHash) |",
              (($b.submissions // [])[] | "| Upload to \($store) | [\(.id)](\($p)/submissions/\(.id)): \(.status) |"),
              (if $b.error then "| Build error | \($b.error.message | cell) |" else empty end),
              (($b.submissions // [])[] | select(.error) | "| Upload error | \(.error.message | cell) |")
            ' "$json" >> "$GITHUB_STEP_SUMMARY"

          build_status=$(jq -r '.[0].status' "$json")
          submit_status=$(jq -r '.[0].submissions[0].status // "NONE"' "$json")
          if [[ "$build_status" != "FINISHED" ]]; then
            echo "::error::The EAS production build ended with status $build_status. Open the build link in the job summary for its logs."
          elif [[ "$submit_status" != "FINISHED" ]]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "$hint" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The upload to $store ended with status $submit_status. $hint"
          else
            {
              echo
              echo "Uploaded to $store. The rest of the release is manual: see apps/mobile/docs/releasing-$PLATFORM.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
